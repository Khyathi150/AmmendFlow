version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: amendflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: amendflow_prod
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: amendflow-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/amendflow_prod
      JWT_SECRET: production-grade-amendflow-secret-key-32chars
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:80
      UPLOAD_DIR: /app/uploads
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: amendflow-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:

